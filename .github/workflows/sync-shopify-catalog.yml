name: Sync Shopify catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: shopify-catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare the automation branch
        shell: bash
        run: |
          branch="automation/shopify-catalog-sync"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            git rebase origin/main
          else
            git switch -c "$branch"
          fi

      - name: Generate catalog data from Shopify
        run: node scripts/sync-shopify-catalog.mjs --write
        env:
          SHOPIFY_STORE_DOMAIN: steinheim.myshopify.com

      - name: Commit catalog changes
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- data/shopify-catalog.generated.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shopify-catalog.generated.json
          git commit -m "chore: sync Shopify catalog"
          git push --force-with-lease --set-upstream origin automation/shopify-catalog-sync
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update the catalog PR
        if: steps.commit.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh pr list --head automation/shopify-catalog-sync --base main --state open --json number --jq 'length' | grep -q '^0$'; then
            gh pr create \
              --base main \
              --head automation/shopify-catalog-sync \
              --title "Sync Shopify products to the website" \
              --body "Automatically generated from Shopify's published catalog. Review product placement, names, finishes, images, and fallback prices before merging. This workflow never pushes directly to main."
          else
            gh pr comment automation/shopify-catalog-sync --body "Shopify changed again, so this PR has been refreshed with the latest published catalog."
          fi
